name: Build iziVK

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - '**.md'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
              
      - name: Download tools
        run: |
          sudo apt update
          sudo apt install default-jre
          sudo apt install python3
          sudo apt install zipalign
          chmod +x scripts/apktool.jar
          chmod +x scripts/apksigner.jar
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android 
          
      - name: Build iziVK
        run: |
          gradle generateBuildTasks
          gradle prepareDexForMergeDev
          java -jar scripts/apktool.jar b smali -o smali/iziVK.apk --use-aapt2 -p scripts/framework/
          zipalign -p -f 4 smali/iziVK.apk smali/iziVK.apk_aligned
          mv smali/iziVK.apk_aligned smali/iziVK.apk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Sign and verify the apk
        run: |
          java -jar scripts/apksigner.jar sign --ks scripts/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android smali/iziVK.apk
          java -jar scripts/apksigner.jar verify smali/iziVK.apk
                      
      - name: Upload apk to artifact
        uses: actions/upload-artifact@v3
        with:
          name: iziVK.apk
          path: smali/iziVK.apk
